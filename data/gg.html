<!DOCTYPE html>
<html>
<head>
    <title>HTML Form Example</title>
</head>
<body>

    <h2>Registration Form</h2>

    <form action="" method="post">

        <!-- Text Input -->
        <label for="fullname">Full Name</label><br>
        <input type="text" id="fullname" name="fullname"><br><br>

        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <!-- Password -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <!-- Number -->
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age"><br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <!-- Date -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <!-- Time -->
        <label for="time">Preferred Time:</label><br>
        <input type="time" id="time" name="time"><br><br>

        <!-- Color -->
        <label for="color">Favorite Color:</label><br>
        <input type="color" id="color" name="color"><br><br>

        
        <label for="file">Upload Resume:</label><br>
        <input type="file" id="file" name="file"><br><br>

        <!-- Dropdown -->
        <label for="country">Country:</label><br>
        <select id="country" name="country">
            <option value="">Select Country</option>
            <option value="bd">Bangladesh</option>
            <option value="in">India</option>
            <option value="us">USA</option>
            <option value="ca">Canada</option>
        </select>
        <br><br>

        <!-- Radio Buttons -->
        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <!-- Checkboxes -->
        <label>Skills:</label><br>

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="js" name="skills" value="js">
        <label for="js">JavaScript</label><br>

        <input type="checkbox" id="flutter" name="skills" value="flutter">
        <label for="flutter">Flutter</label><br><br>

        <!-- Text Area -->
        <label for="about">About Yourself:</label><br>
        <textarea id="about" name="about" rows="5" cols="40"></textarea>
        <br><br>

        <!-- Range -->
        <label for="experience">Experience Level:</label><br>
        <input type="range" id="experience" name="experience" min="0" max="10">
        <br><br>

        <!-- URL -->
        <label for="website">Website:</label><br>
        <input type="url" id="website" name="website">
        <br><br>

        <!-- Search -->
        <label for="search">Search:</label><br>
        <input type="search" id="search" name="search">
        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <button type="button">Normal Button</button>

    </form>

</body>
</html>
